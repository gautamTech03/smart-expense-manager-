<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>SmartTrack</h2>

            <nav>
                <a href="#" class="active">Dashboard</a>
                <a href="#">Transactions</a>
                <a href="#">Analytics</a>
                <a href="#">Budgets</a>
                <a href="#">Settings</a>
            </nav>
        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="header">
                <div>
                    <h1>Dashboard</h1>
                    <p>Welcome to your expense tracker!</p>
                </div>

                <button id="showFormBtn">+ Add Transaction</button>
            </header>


            <!-- Dashboard Cards -->
            <section class="cards">

                <div class="card">
                    <h3>Total Balance</h3>
                    <h2 id="balance">₹0</h2>
                </div>

                <div class="card">
                    <h3>Total Income</h3>
                    <h2 id="income">₹0</h2>
                </div>

                <div class="card">
                    <h3>Total Expenses</h3>
                    <h2 id="expenses">₹0</h2>
                </div>

            </section>


            <!-- Add Transaction Form -->
            <form id="transactionForm" hidden>

                <h2>Add New Transaction</h2>

                <label for="transactionName">Transaction Name</label>
                <input type="text" id="transactionName" placeholder="Example: Food" required>

                <label for="transactionAmount">Amount (₹)</label>
                <input type="number" id="transactionAmount" placeholder="Enter amount" min="0.01" step="0.01" required>

                <label for="transactionType">Transaction Type</label>
                <select id="transactionType">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <label for="transactionCategory">Category</label>
                <select id="transactionCategory">
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Salary">Salary</option>
                    <option value="Other">Other</option>
                </select>

                <label for="transactionDate">Transaction Date</label>
                <input type="date" id="transactionDate" required>

                <button type="submit">Add Transaction</button>

            </form>

            <!-- analytic's section -->

            <section class="analytics">
                <h2>Expense Analytics</h2>

                <div class="chart-container">
                    <div class="chart-box">
                        <h3>Expenses by Category</h3>
                        <canvas id="expenseChart"></canvas>
                    </div>

                    <div class="chart-box">
                        <h3>Income vs Expenses</h3>
                        <canvas id="incomeExpenseChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- ================================== -->
            <!-- MONTHLY BUDGET SECTION -->
            <!-- ================================== -->

            <section class="budget-section">

                <h2>Monthly Budget</h2>

                <form id="budgetForm">

                    <input type="text" id="budgetCategory" placeholder="Enter category" required>

                    <input type="number" id="budgetAmount" placeholder="Enter budget amount" min="1" required>

                    <button type="submit">Set Budget</button>

                </form>

                <div id="budgetList"></div>

            </section>

            <!-- Recent Transactions -->

            <section class="transactions">

                <h2>Recent Transactions</h2>

                <!-- Search and Filter Controls -->

                <div class="filter-controls">

                    <input type="text" id="searchInput" placeholder="Search transactions...">

                    <select id="typeFilter">
                        <option value="all">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>

                    <select id="categoryFilter">
                        <option value="all">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Salary">Salary</option>
                        <option value="Other">Other</option>
                    </select>

                </div>

                <div id="transactionList"></div>

            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/script.js"></script>

</body>

</html>
